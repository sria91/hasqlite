[package]
name = "hasqlite-sync"
description = "Replication scheduling (currently backed by rsqlite-rsync)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
hasqlite-core = { path = "../hasqlite-core" }
# Transitional implementation dependency; remove after the native backend and
# dependency-free replication tests satisfy the cutover criteria in docs/PLAN.md.
# Pinned by commit (v0.5.0) because tags can be moved.
rsqlite-rsync = { git = "https://github.com/sria91/rsqlite-rsync", rev = "6a836c9abcf418025c29762728e7f9e5af909433" }
thiserror.workspace = true
tokio = { workspace = true, features = ["fs"] }

[dev-dependencies]
libsqlite3-sys = { version = "0.38", features = ["bundled"] }
tempfile = "3"
tokio = { workspace = true, features = ["net"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.14", features = ["transport"] }
