name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# Third-party actions are pinned by commit SHA (tags and branches can be moved), with the version in a
# trailing comment; Dependabot keeps them current (.github/dependabot.yml).
jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: docstring coverage & docs
        run: cargo doc --no-deps --workspace --locked
        env:
          RUSTDOCFLAGS: -D warnings -D missing_docs
      - name: test
        run: cargo test --workspace --locked

  msrv:
    # Keep in sync with `workspace.package.rust-version` in Cargo.toml.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.89"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: test on minimum supported Rust
        run: cargo test --workspace --locked

  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-llvm-cov
      # Restored caches can hold instrumented objects from older sources, which llvm-cov would count as
      # uncovered functions; start every run from a clean coverage build.
      - name: clean coverage artifacts
        run: cargo llvm-cov clean --workspace
      # Promotion and fencing logic must stay at or above the testing.md §6.1 coverage target in each crate.
      - name: controller coverage
        run: cargo llvm-cov --locked -p hasqlite-controller --fail-under-lines 95
      - name: lease coverage
        run: cargo llvm-cov --locked -p hasqlite-lease --fail-under-lines 95
      # Fail-closed configuration validation (ADR-0017) and identifier rules live here.
      - name: core coverage
        run: cargo llvm-cov --locked -p hasqlite-core --fail-under-lines 95
      # The crash-safe ledger publication path (safety contract rule 9) lives here.
      - name: sync coverage
        run: cargo llvm-cov --locked -p hasqlite-sync --fail-under-lines 90

  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The workspace carries a Git dependency (rsqlite-rsync); keep its transitive advisories visible.
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
