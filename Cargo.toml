[workspace]
resolver = "3"
members = [
    "crates/hasqlite-core",
    "crates/hasqlite-lease",
    "crates/hasqlite-controller",
    "crates/hasqlite-sync",
    "crates/hasqlite-probes",
    "crates/hasqlite-node",
    "hasqlite",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sria91/hasqlite"
version = "0.0.0"

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
tracing = "0.1"
